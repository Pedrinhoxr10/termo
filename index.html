<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe6dc;--empty:#e0d3c6;--tile:#6f6467;--dim:#a89a93;--ink:#2c2427;--key:#d6c8ba;--green:#3aa394;--yellow:#d3ad69;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6d5b66;--empty:#5a4a53;--tile:#302a2c;--dim:#473d41;--ink:#f6eef1;--key:#4b3f47}}
:root[data-theme="dark"]{--bg:#6d5b66;--empty:#5a4a53;--tile:#302a2c;--dim:#473d41;--ink:#f6eef1;--key:#4b3f47}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
section{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:460px;margin:0 auto;padding:12px 16px 16px;box-sizing:border-box}
h1{margin:18px 0 4px;font-weight:900;font-size:30px;letter-spacing:.06em;text-align:center}
.slogan{margin:0 0 24px;text-align:center;font-weight:700;font-size:14px;font-style:italic;opacity:.65}
h2{margin:6px 0;font-weight:900;letter-spacing:.08em}
#cards{width:100%}
.reset{margin-top:20px;background:none;border:0;color:var(--ink);opacity:.5;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.card{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin-bottom:10px;border:0;border-radius:12px;background:var(--tile);color:#fff;font:inherit;font-weight:900;font-size:18px;text-align:left;cursor:pointer}
.card small{display:block;font-size:13px;letter-spacing:.2em;opacity:.8;margin-top:2px}
.card b{font-size:20px}
.card:disabled{opacity:.55;cursor:default}
.top{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:800}
.top button{font:inherit;font-size:22px;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 8px}
#board{display:grid;gap:4px;justify-items:center}
.r{display:flex;gap:4px}
.t{width:var(--s);height:var(--s);display:grid;place-items:center;border-radius:5px;background:var(--empty);color:var(--ink);font-style:normal;font-weight:900;font-size:calc(var(--s)*.55);transition:transform .25s}
.t.f{outline:2px solid var(--ink);outline-offset:-2px}
.t.cur{box-shadow:0 0 0 3px var(--ink)}
.t.g,.kb .g{background:var(--green);color:#fff}
.t.y,.kb .y{background:var(--yellow);color:#fff}
.t.x,.kb .x{background:var(--dim);color:#fff}
.sp{transform:rotateX(90deg)}
.r.sh{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kb{width:100%;margin-top:auto;padding-top:14px;display:grid;gap:6px}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:38px;height:48px;padding:0;border:0;border-radius:6px;background:var(--key);color:var(--ink);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.kb .w{max-width:62px;flex:1.7;font-size:12px}
#stage{position:relative;width:100%;margin-top:34px}
.w2{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:4px;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.q{opacity:0}
.ring{position:relative;opacity:0;transition:opacity .9s;text-align:center;margin-top:34px}
.ring .shine{filter:drop-shadow(0 0 10px rgba(79,184,229,.7))}
.ring.on{opacity:1}
.btn{font:inherit;font-weight:900;font-size:18px;color:#fff;background:var(--green);border:0;border-radius:10px;padding:12px 36px;margin-top:16px;cursor:pointer}
.ring:not(.on){pointer-events:none}
.btns{display:flex;gap:14px;justify-content:center;margin-top:16px}
.btns .btn{margin-top:0}
.btn.no{background:var(--tile);transition:left .25s,top .25s}
#ov,#yes{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.55)}
#yes{background:var(--bg);text-align:center;overflow:hidden;padding-bottom:clamp(64px,11vh,120px)}
#heartsBg{position:absolute;inset:0;overflow:hidden;z-index:1}
.ground{position:absolute;left:0;right:0;bottom:0;height:clamp(64px,11vh,120px);z-index:0;
  background-image:
    linear-gradient(135deg,transparent 50%,#6fbf4a 50%),
    linear-gradient(225deg,transparent 50%,#6fbf4a 50%),
    linear-gradient(180deg,#6fbf4a,#2f6b26);
  background-position:0 0,11px 0,0 0;
  background-size:22px 22px,22px 22px,100% 100%;
  background-repeat:repeat-x,repeat-x,no-repeat}
.blade{position:absolute;bottom:0;width:7px;clip-path:polygon(50% 0,0 100%,100% 100%);transform-origin:bottom center}
.hrt{position:absolute;bottom:-10%;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg);opacity:0}}
#loveText{position:relative;z-index:2;margin:0;text-align:center;max-width:320px}
#loveText span{display:inline-block;opacity:0;transform:scale(.4) translateY(16px);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popIn{to{opacity:1;transform:scale(1) translateY(0)}}
.finwrap{position:relative;z-index:2;opacity:0;animation:fadein .6s ease forwards;animation-delay:1.3s}
@keyframes fadein{to{opacity:1}}
.finring{position:relative;z-index:2;margin-top:4px;opacity:0;transform:scale(.6)}
.finring.on{animation:ringpop .7s ease forwards}
.frow{display:flex;align-items:center;justify-content:center;gap:16px}
.fr-bouquet{width:94px;height:94px}
.shine{filter:drop-shadow(0 0 10px rgba(79,184,229,.7))}
@keyframes ringpop{to{opacity:1;transform:scale(1)}}
.tw{position:absolute;font-size:14px;animation:twinkle 1.6s ease-in-out infinite}
.tw.t1{top:4px;left:26%;animation-delay:.3s}
.tw.t2{top:14px;right:22%;animation-delay:.9s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.card2{background:var(--bg);border-radius:16px;padding:26px 30px;text-align:center;max-width:320px}
.card2 p{margin:0 0 8px;font-weight:800}
.big{font-size:64px;line-height:1.1}
.chest{position:relative;width:130px;height:100px;margin:8px auto 2px;cursor:pointer}
.chest.shake{animation:unlock .38s ease}
@keyframes unlock{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-4px) rotate(-3deg)}40%{transform:translateY(0) rotate(3deg)}60%{transform:translateY(-3px) rotate(-2deg)}80%{transform:translateY(0) rotate(2deg)}}
.chest .glow{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,190,.65),transparent 70%);animation:pulse 1.6s ease-in-out infinite}
.chest.open .glow{animation:none;opacity:1;transform:scale(1.5)}
.chest .box{position:absolute;left:8px;right:8px;bottom:0;height:58px;background:linear-gradient(#e8a9bb,#c97a93);border:3px solid #7a3c54;border-radius:0 0 10px 10px}
.chest .lid{position:absolute;left:4px;right:4px;top:12px;height:40px;background:linear-gradient(#f6d2d9,#e8a9bb);border:3px solid #7a3c54;border-radius:10px 10px 2px 2px;transform-origin:bottom center;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.chest.open .lid{transform:rotateX(-125deg)}
.chest .clasp{position:absolute;left:50%;top:36px;transform:translateX(-50%);font-size:16px;line-height:1;color:#e8536f}
.chest .spark{position:absolute;font-size:16px;animation:floaty 2.4s ease-in-out infinite}
.chest.open .spark{display:none}
.spark.s1{left:-8px;top:4px}
.spark.s2{right:-10px;top:-2px}
.spark.s3{left:48%;top:-16px;animation-delay:.6s}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(10deg)}}
.hb{position:absolute;left:50%;top:55%;font-size:17px;opacity:0;animation:hburst .9s ease-out forwards}
@keyframes hburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot))}}
.tap{margin-top:8px;font-weight:800;opacity:.75;animation:blinktap 1.4s infinite}
@keyframes blinktap{50%{opacity:.3}}
.gift{font-size:60px;line-height:1;margin:4px 0}
.gift svg{width:76px;height:76px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:800}
.cf{position:fixed;top:-14px;width:10px;height:10px;border-radius:2px;animation:fall linear both}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.w2,.ring,.t{transition:none}.hrt{display:none}#loveText span{animation:none;opacity:1;transform:none}.chest .glow,.chest .spark,.tap,.chest.shake{animation:none}.hb{display:none}.finring.on{animation:none;opacity:1;transform:none}.finwrap{animation:none;opacity:1}.tw{animation:none}}
</style>
</head>
<body>

<section id="menu"><h1>TERMO</h1><p class="slogan">Até onde uma palavra pode te levar?</p><div id="cards"></div><button id="rst" class="reset">Reiniciar progresso</button></section>

<section id="game" hidden>
  <div class="top"><button id="back" aria-label="Voltar">←</button><span id="info"></span></div>
  <div id="board"></div>
  <div class="kb" id="kb"></div>
</section>

<section id="fin" hidden>
  <div id="stage"></div>
  <div class="ring" id="ring">
    <div class="tw t1">✨</div><div class="tw t2">✨</div>
    <svg class="shine" width="120" height="120" viewBox="0 0 120 120" aria-label="Aliança com pedra azul">
      <circle cx="60" cy="76" r="30" fill="none" stroke="#c99a2e" stroke-width="9"/>
      <circle cx="60" cy="76" r="30" fill="none" stroke="#f3d580" stroke-width="2" stroke-dasharray="70 120"/>
      <polygon points="60,18 76,36 60,56 44,36" fill="#4fb8e5"/>
      <polygon points="60,18 76,36 60,40 44,36" fill="#bfe9f5"/>
      <polyline points="44,36 76,36" stroke="#fff" stroke-width="1.5" fill="none"/>
    </svg><br>
    <div class="btns">
      <button class="btn" id="sim">SIM</button>
      <div id="nw"><button class="btn no" id="nao">NÃO</button></div>
    </div>
  </div>
</section>

<div id="ov" hidden></div>
<div id="yes" hidden>
  <div class="ground">
    <i class="blade" style="left:6%;height:30px;background:#8fd666;transform:rotate(-8deg)"></i>
    <i class="blade" style="left:14%;height:20px;background:#5fa83c;transform:rotate(10deg)"></i>
    <i class="blade" style="left:26%;height:34px;background:#79c955;transform:rotate(-4deg)"></i>
    <i class="blade" style="left:38%;height:18px;background:#8fd666;transform:rotate(14deg)"></i>
    <i class="blade" style="left:52%;height:28px;background:#5fa83c;transform:rotate(-12deg)"></i>
    <i class="blade" style="left:64%;height:22px;background:#79c955;transform:rotate(6deg)"></i>
    <i class="blade" style="left:76%;height:32px;background:#8fd666;transform:rotate(-6deg)"></i>
    <i class="blade" style="left:88%;height:20px;background:#5fa83c;transform:rotate(12deg)"></i>
  </div>
  <div id="heartsBg"></div>
  <h2 id="loveText" style="font-size:38px"></h2>
  <div class="finwrap" id="finwrap">
    <div class="chest" id="finchest">
      <div class="glow"></div>
      <div class="spark s1">✨</div><div class="spark s2">💗</div><div class="spark s3">✨</div>
      <div class="box"></div><div class="lid"></div><div class="clasp">❤</div>
    </div>
    <p class="tap">Toque para abrir</p>
  </div>
  <div class="finring" id="finring">
    <div class="tw t1">✨</div><div class="tw t2">✨</div>
    <div class="frow">
      <svg class="shine" width="114" height="114" viewBox="0 0 120 120" aria-label="Aliança com pedra azul">
        <circle cx="60" cy="80" r="28" fill="none" stroke="#c99a2e" stroke-width="8"/>
        <circle cx="60" cy="80" r="28" fill="none" stroke="#f3d580" stroke-width="2" stroke-dasharray="60 110"/>
        <polygon points="60,26 76,42 60,60 44,42" fill="#4fb8e5"/>
        <polygon points="60,26 76,42 60,46 44,42" fill="#bfe9f5"/>
        <polyline points="44,42 76,42" stroke="#fff" stroke-width="1.5" fill="none"/>
      </svg>
      <div class="fr-bouquet shine" id="bouquetSlot"></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
/* ===== Configuração =====
   Para testar: abra o arquivo com ?final (vai direto à tela final) ou ?reset (zera o progresso). */
const LV=[
  {w:['URSINHO','BEIJO','MAGIA']},
  {w:['COMIGO','QUER','BRUNA','NAMORAR']}
];
const TRIES=9;
const GIFTS=['🧸','😘','🪄'];

/* Buquê azul/branco desenhado na mão (ilustração simples, sem direitos de terceiros) */
function flower(x,y,r){
  let g=`<g transform="translate(${x} ${y})">`;
  for(let a=0;a<360;a+=72)g+=`<ellipse rx="${r}" ry="${r*.6}" transform="rotate(${a}) translate(0 -${(r*.62).toFixed(1)})" fill="#bcdcf5"/>`;
  g+=`<circle r="${(r*.4).toFixed(1)}" fill="#fff" stroke="#4f86d6" stroke-width="1.2"/></g>`;
  return g;
}
const BOUQUET=`<svg viewBox="0 0 100 100" width="100%" height="100%">
<path d="M26 94 L74 94 L88 55 L12 55 Z" fill="#fff" stroke="#4f86d6" stroke-width="3"/>
<path d="M34 92 L44 56" stroke="#dbe9f7" stroke-width="2" fill="none"/>
<path d="M66 92 L56 56" stroke="#dbe9f7" stroke-width="2" fill="none"/>
<path d="M50 55 Q40 40 32 22" stroke="#5b8a4f" stroke-width="3" fill="none"/>
<path d="M50 55 Q45 38 42 18" stroke="#5b8a4f" stroke-width="3" fill="none"/>
<path d="M50 55 Q50 35 50 14" stroke="#5b8a4f" stroke-width="3" fill="none"/>
<path d="M50 55 Q55 38 58 18" stroke="#5b8a4f" stroke-width="3" fill="none"/>
<path d="M50 55 Q60 40 68 22" stroke="#5b8a4f" stroke-width="3" fill="none"/>
<ellipse cx="38" cy="44" rx="6" ry="3" fill="#6fa05c" transform="rotate(-35 38 44)"/>
<ellipse cx="62" cy="44" rx="6" ry="3" fill="#6fa05c" transform="rotate(35 62 44)"/>
${flower(32,22,9)}${flower(42,18,10)}${flower(50,14,12)}${flower(58,18,10)}${flower(68,22,9)}
<g transform="translate(50 74)">
  <polygon points="0,0 -13,-8 -13,8" fill="#4f86d6"/>
  <polygon points="0,0 13,-8 13,8" fill="#4f86d6"/>
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#2f5fa8"/>
</g>
</svg>`;

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let S={p:[0,0]},G=null;
function save(){try{localStorage.setItem('tb',JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem('tb'))||S}catch(e){}
const Q=location.search;
if(Q.includes('reset')){S={p:[0,0]};save()}
if(Q.includes('final'))S={p:[3,4]};

const go=id=>['menu','game','fin'].forEach(s=>$('#'+s).hidden=s!=id);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1300)}
function score(g,a){
  const r=Array(a.length).fill('x'),c={};
  for(let i=0;i<a.length;i++){if(g[i]==a[i])r[i]='g';else c[a[i]]=(c[a[i]]||0)+1}
  for(let i=0;i<a.length;i++){if(r[i]=='x'&&c[g[i]]>0){r[i]='y';c[g[i]]--}}
  return r;
}

/* ===== Menu de níveis ===== */
function menu(){
  go('menu');
  const p=S.p,open=[true,p[0]>=3,p[1]>=4],done=[p[0]>=3,p[1]>=4,false];
  $('#cards').innerHTML=[0,1,2].map(i=>{
    const dots=i<2?'●'.repeat(p[i])+'○'.repeat(LV[i].w.length-p[i]):'';
    return `<button class="card" data-l="${i}" ${open[i]?'':'disabled'}><span>Nível ${i+1}<small>${dots}</small></span><b>${done[i]?'✓':open[i]?'▶':'🔒'}</b></button>`;
  }).join('');
  $$('.card').forEach(c=>c.onclick=()=>{
    const l=+c.dataset.l;
    if(l==2)fin();else start(l,p[l]>=LV[l].w.length?0:p[l]);
  });
}

/* ===== Jogo ===== */
function start(l,i){
  const w=LV[l].w[i];
  G={l,i,w,g:[],cur:Array(w.length).fill(''),pos:0,k:{},busy:false};
  go('game');
  $('#info').textContent=`Nível ${l+1} · palavra ${i+1} de ${LV[l].w.length}`;
  board();keys();
}
function board(){
  const n=G.w.length,W=Math.min(innerWidth,460)-32;
  const s=Math.max(26,Math.min(50,(W-(n-1)*4)/n,(innerHeight-320)/TRIES-4));
  const b=$('#board');b.style.setProperty('--s',s+'px');
  b.innerHTML=Array.from({length:TRIES},()=>`<div class="r">${'<i class="t"></i>'.repeat(n)}</div>`).join('');
  G.g.forEach((g,r)=>paint(r,g,false));
  draw();
}
function draw(){
  const row=$$('#board .r')[G.g.length];if(!row)return;
  [...row.children].forEach((e,i)=>{e.textContent=G.cur[i]||'';e.className='t'+(G.cur[i]?' f':'')+(i==G.pos?' cur':'')});
}
function paint(r,g,anim){
  const s=score(g,G.w),row=$$('#board .r')[r].children;
  [...g].forEach((l,i)=>{
    const e=row[i];e.textContent=l;
    const set=()=>{e.className='t '+s[i]};
    if(!anim){set();return}
    setTimeout(()=>e.classList.add('sp'),i*260);
    setTimeout(set,i*260+250);
  });
}
function keys(){
  const rows=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','⌫']];
  $('#kb').innerHTML=rows.map(r=>`<div>${r.map(k=>`<button data-k="${k}" class="${G.k[k]||''}${k.length>1&&k!='⌫'?' w':''}">${k}</button>`).join('')}</div>`).join('');
  $$('#kb button').forEach(b=>b.onclick=()=>{key(b.dataset.k);b.blur()});
}
function key(k){
  if(!G||G.busy||!$('#ov').hidden)return;
  const n=G.w.length;
  if(k=='⌫'){
    if(G.cur[G.pos])G.cur[G.pos]='';
    else if(G.pos>0){G.pos--;G.cur[G.pos]='';}
  }
  else if(k=='ENTER'){
    if(G.cur.some(c=>!c)){
      toast('Faltam letras');
      const r=$$('#board .r')[G.g.length];r.classList.add('sh');setTimeout(()=>r.classList.remove('sh'),300);
      return;
    }
    submit();return;
  }
  else if(/^[A-Z]$/.test(k)){
    G.cur[G.pos]=k;
    let nxt=-1;
    for(let i=G.pos+1;i<n;i++)if(!G.cur[i]){nxt=i;break}
    if(nxt==-1)for(let i=0;i<n;i++)if(!G.cur[i]){nxt=i;break}
    G.pos=nxt==-1?Math.min(G.pos+1,n-1):nxt;
  }
  draw();
}
function submit(){
  const g=G.cur.join(''),r=G.g.length,s=score(g,G.w);
  G.g.push(g);G.cur=Array(G.w.length).fill('');G.pos=0;G.busy=true;
  paint(r,g,true);
  setTimeout(()=>{
    const o={g:3,y:2,x:1};
    [...g].forEach((l,i)=>{if(!G.k[l]||o[s[i]]>o[G.k[l]])G.k[l]=s[i]});
    keys();
    if(g==G.w)setTimeout(win,600);
    else if(G.g.length>=TRIES){
      toast('Quase! Vamos de novo');
      setTimeout(()=>{G.g=[];G.cur=Array(G.w.length).fill('');G.pos=0;G.busy=false;board()},1400);
    }else G.busy=false;
  },(g.length-1)*260+550);
}
function nextStep(l,i,last){
  $('#ov').hidden=true;
  if(last)(l==1?fin():menu());
  else start(l,i+1);
}
function win(){
  const {l,i,w}=G,last=i==LV[l].w.length-1;
  S.p[l]=Math.max(S.p[l],i+1);save();
  const o=$('#ov');o.hidden=false;
  if(l==0){
    o.innerHTML=`<div class="card2 chestcard">
      <div class="chest" id="chest">
        <div class="glow"></div>
        <div class="spark s1">✨</div><div class="spark s2">💗</div><div class="spark s3">✨</div>
        <div class="box"></div><div class="lid"></div><div class="clasp">❤</div>
      </div>
      <p class="tap">Toque para abrir</p>
    </div>`;
    $('#chest').onclick=()=>{
      const chest=$('#chest');
      if(chest.classList.contains('shake')||chest.classList.contains('open'))return;
      chest.classList.add('shake');
      setTimeout(()=>{
        chest.classList.remove('shake');
        chest.classList.add('open');
        for(let k=0;k<8;k++){
          const h=document.createElement('i');h.className='hb';
          h.textContent=['💗','💕','💖'][k%3];
          h.style.setProperty('--dx',(Math.random()*80-40)+'px');
          h.style.setProperty('--dy',(-60-Math.random()*50)+'px');
          h.style.setProperty('--rot',(Math.random()*60-30)+'deg');
          h.style.animationDelay=(k*55)+'ms';
          chest.appendChild(h);
        }
      },380);
      setTimeout(()=>{
        $('.chestcard').innerHTML=`<p>Presente desbloqueado 🎁</p><div class="gift">${GIFTS[i]}</div><h2>${w}</h2><button class="btn" id="nx">Continuar</button>`;
        $('#nx').onclick=()=>nextStep(l,i,last);
      },380+900);
    };
    return;
  }
  let h=last?`<p>Novo nível desbloqueado</p><div class="big">🔓</div>`:`<p>Palavra encontrada</p><h2>${w}</h2>`;
  h+=`<button class="btn" id="nx">${last&&l==1?'Abrir':'Continuar'}</button>`;
  o.innerHTML=`<div class="card2">${h}</div>`;
  $('#nx').onclick=()=>nextStep(l,i,last);
}

/* ===== Tela final ===== */
function fin(){
  go('fin');
  const solved=['COMIGO','QUER','BRUNA','NAMORAR'],ord=['BRUNA','QUER','NAMORAR','COMIGO'];
  const s=Math.min(36,(Math.min(innerWidth,460)-32-24)/7),H=s+12;
  const st=$('#stage');st.style.cssText=`--s:${s}px;height:${H*4}px`;
  st.innerHTML=solved.map((w,j)=>`<div class="w2" data-w="${w}" style="transform:translateY(${j*H}px)">${[...w].map(l=>`<i class="t x">${l}</i>`).join('')}${w=='COMIGO'?'<i class="t x q">?</i>':''}</div>`).join('');
  $('#ring').classList.remove('on');resetNo();
  setTimeout(()=>$$('.w2').forEach(e=>e.style.transform=`translateY(${ord.indexOf(e.dataset.w)*H}px)`),1000);
  let c=0;
  ord.forEach(w=>[...$(`.w2[data-w="${w}"]`).children].forEach(t=>{
    const d=2400+c++*90;
    setTimeout(()=>t.classList.add('sp'),d);
    setTimeout(()=>{t.className='t g'},d+250);
  }));
  setTimeout(()=>$('#ring').classList.add('on'),2400+c*90+700);
}
function openFinChest(){
  const c=$('#finchest');
  if(c.classList.contains('shake')||c.classList.contains('open'))return;
  c.classList.add('shake');
  setTimeout(()=>{
    c.classList.remove('shake');
    c.classList.add('open');
    for(let k=0;k<8;k++){
      const h=document.createElement('i');h.className='hb';
      h.textContent=['💗','💕','💖'][k%3];
      h.style.setProperty('--dx',(Math.random()*80-40)+'px');
      h.style.setProperty('--dy',(-60-Math.random()*50)+'px');
      h.style.setProperty('--rot',(Math.random()*60-30)+'deg');
      h.style.animationDelay=(k*55)+'ms';
      c.appendChild(h);
    }
  },380);
  setTimeout(()=>{
    $('#finwrap').hidden=true;
    $('#finring').classList.add('on');
  },380+900);
}
$('#sim').onclick=()=>{
  const y=$('#yes'),cols=['#4f86d6','#ffffff','#caa052'];
  const c=$('#finchest');c.className='chest';c.querySelectorAll('.hb').forEach(h=>h.remove());
  $('#finwrap').hidden=false;$('#finring').classList.remove('on');
  $('#loveText').innerHTML=[...'Eu te amo!!!'].map((c,i)=>c==' '?' ':`<span style="animation-delay:${i*70}ms">${c}</span>`).join('');
  const bg=$('#heartsBg');bg.innerHTML='';
  const em=['💙','🤍','💙','🤍','✨'];
  for(let i=0;i<24;i++){
    const h=document.createElement('span');h.className='hrt';h.textContent=em[i%em.length];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(14+Math.random()*16)+'px';
    h.style.animationDuration=(5+Math.random()*5)+'s';
    h.style.animationDelay=(Math.random()*5)+'s';
    bg.appendChild(h);
  }
  y.hidden=false;
  for(let i=0;i<50;i++){
    const d=document.createElement('i');d.className='cf';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%3]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*1.5}s`;
    y.appendChild(d);
  }
};

/* ===== Eventos ===== */
$('#board').addEventListener('click',e=>{
  if(!G||G.busy)return;
  const t=e.target.closest('.t');if(!t)return;
  const rows=$$('#board .r'),r=rows.indexOf(t.parentElement);
  if(r!=G.g.length)return;
  G.pos=[...t.parentElement.children].indexOf(t);
  draw();
});
const no=$('#nao'),nw=$('#nw');
function resetNo(){no.style.cssText='';delete no.dataset.m;nw.style.cssText=''}
function dodge(){
  if(!no.dataset.m){
    const r=no.getBoundingClientRect();
    nw.style.width=r.width+'px';nw.style.height=r.height+'px';
    no.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;z-index:3`;
    no.dataset.m=1;void no.offsetWidth;
  }
  const w=no.offsetWidth,h=no.offsetHeight,p=12,s=$('#sim').getBoundingClientRect();
  let x,y,n=0;
  do{x=p+Math.random()*(innerWidth-w-2*p);y=p+Math.random()*(innerHeight-h-2*p);n++}
  while(n<20&&x<s.right+16&&x+w>s.left-16&&y<s.bottom+16&&y+h>s.top-16);
  no.style.left=x+'px';no.style.top=y+'px';
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
no.onclick=()=>{dodge();toast('Nem tenta 😏')};
$('#finchest').onclick=openFinChest;
$('#back').onclick=menu;
$('#rst').onclick=()=>{if(confirm('Reiniciar todo o progresso do zero? Os níveis seguintes voltam a ficar trancados.')){S={p:[0,0]};save();menu();}};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||$('#game').hidden)return;
  const k=e.key.length==1?e.key.toUpperCase():e.key=='Backspace'?'⌫':e.key=='Enter'?'ENTER':'';
  if(k){e.preventDefault();key(k)}
});
addEventListener('resize',()=>{if(G&&!$('#game').hidden)board()});

$('#bouquetSlot').innerHTML=BOUQUET;
Q.includes('final')?fin():menu();
</script>
